name: AlphaPulse — Monthly Strategy Health & Attention Audit

on:
  schedule:
    # Runs at 09:00 IST (03:30 UTC) on the 1st of every month
    - cron: '30 3 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-strategy-audit
  cancel-in-progress: false

jobs:
  monthly_audit:
    name: Monthly Strategy Health & Attention Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Alpha-Pulse Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monthly Strategy Health & Alpha Audit
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_API_KEY: ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET: ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python monthly_strategy_audit.py

      - name: Upload Monthly Audit Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-strategy-audit-report
          path: audit_reports/monthly_audit_*.json
          retention-days: 90
