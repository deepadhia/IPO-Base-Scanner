name: Listing Day Breakout Scanner

on:
  # ── Scheduling note ────────────────────────────────────────────────────────
  # This workflow is triggered exclusively via workflow_dispatch by the
  # Cloudflare Worker dispatcher (cloudflare-dispatcher/src/index.js).
  # The Worker fires every 15 min during 03:00–10:59 UTC (Mon–Fri) and calls
  # the GitHub API at exact :15/:45 slots — bypassing GitHub's internal
  # scheduler, which is known to delay runs by 30 min to 3+ hours.
  #
  # DO NOT add on:schedule: back here — it will cause duplicate runs.
  # To change the schedule, edit cloudflare-dispatcher/src/index.js → SCHEDULE.
  # ────────────────────────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      check_new_ipos:
        description: 'Update listing data for new IPOs first'
        required: false
        default: true
        type: boolean

jobs:
  scan-listing-breakouts:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          set -e
          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "❌ Command failed after $attempts attempts: $*"
                return 1
              fi
              local wait=$((n * 5))
              echo "⚠️ Attempt $n failed. Retrying in ${wait}s: $*"
              sleep "$wait"
              n=$((n + 1))
            done
          }
          python -m pip install --upgrade pip
          # Install beautifulsoup4 first to satisfy both jugaad-data and yfinance
          echo "📦 Installing beautifulsoup4==4.9.3 first..."
          retry 4 pip install --retries 10 --timeout 120 beautifulsoup4==4.9.3
          # Install main dependencies
          echo "📦 Installing main dependencies..."
          retry 4 pip install --retries 10 --timeout 120 -r requirements.txt
          # Install jugaad-data separately to avoid dependency resolver conflicts
          echo "📦 Installing jugaad-data..."
          retry 4 pip install --retries 10 --timeout 120 "jugaad-data>=0.27,<0.28"
          echo "✅ Dependencies installed successfully"
      
      - name: Set up environment variables
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          IPO_YEARS_BACK: ${{ vars.IPO_YEARS_BACK || '1' }}
          LISTING_STRICT_QUALITY: ${{ vars.LISTING_STRICT_QUALITY || 'true' }}
          LISTING_CONFIRMATION_MINUTES: ${{ vars.LISTING_CONFIRMATION_MINUTES || '60' }}
          LISTING_MIN_LEADER_SCORE: ${{ vars.LISTING_MIN_LEADER_SCORE || '5' }}
          LISTING_MIN_VOLUME_MULT: ${{ vars.LISTING_MIN_VOLUME_MULT || '1.8' }}
          LISTING_MIN_VOL_VS_LISTING: ${{ vars.LISTING_MIN_VOL_VS_LISTING || '1.0' }}
          LISTING_MAX_ENTRY_ABOVE_HIGH_PCT: ${{ vars.LISTING_MAX_ENTRY_ABOVE_HIGH_PCT || '3.5' }}
          LISTING_MIN_RISK_REWARD: ${{ vars.LISTING_MIN_RISK_REWARD || '1.25' }}
          LISTING_STOP_LOSS_PCT: ${{ vars.LISTING_STOP_LOSS_PCT || '8.0' }}
          LISTING_MAX_DAYS_SINCE_LISTING: ${{ vars.LISTING_MAX_DAYS_SINCE_LISTING || '365' }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "Environment variables configured"
          if [ -z "$MONGO_URI" ]; then
            echo "❌ ERROR: MONGO_URI is missing! MongoDB is now REQUIRED."
            exit 1
          else
            echo "✅ MONGO_URI is set"
          fi

      - name: Check MongoDB Connection
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -n "$MONGO_URI" ]; then
            echo "🔌 Verifying MongoDB Atlas connection..."
            python test_db_connection.py
          else
            echo "❌ ERROR: MONGO_URI missing"
            exit 1
          fi
      
      - name: Run Listing Day Breakout Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          IPO_YEARS_BACK: ${{ vars.IPO_YEARS_BACK || '1' }}
          LISTING_STRICT_QUALITY: ${{ vars.LISTING_STRICT_QUALITY || 'true' }}
          LISTING_CONFIRMATION_MINUTES: ${{ vars.LISTING_CONFIRMATION_MINUTES || '60' }}
          LISTING_MIN_LEADER_SCORE: ${{ vars.LISTING_MIN_LEADER_SCORE || '5' }}
          LISTING_MIN_VOLUME_MULT: ${{ vars.LISTING_MIN_VOLUME_MULT || '1.8' }}
          LISTING_MIN_VOL_VS_LISTING: ${{ vars.LISTING_MIN_VOL_VS_LISTING || '1.0' }}
          LISTING_MAX_ENTRY_ABOVE_HIGH_PCT: ${{ vars.LISTING_MAX_ENTRY_ABOVE_HIGH_PCT || '3.5' }}
          LISTING_MIN_RISK_REWARD: ${{ vars.LISTING_MIN_RISK_REWARD || '1.25' }}
          LISTING_STOP_LOSS_PCT: ${{ vars.LISTING_STOP_LOSS_PCT || '8.0' }}
          LISTING_MAX_DAYS_SINCE_LISTING: ${{ vars.LISTING_MAX_DAYS_SINCE_LISTING || '365' }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "🔄 Fetching recent IPO symbols to MongoDB..."
          python -c "import os; from fetch import fetch_recent_ipo_symbols; fetch_recent_ipo_symbols(years_back=int(os.environ.get('IPO_YEARS_BACK', 1)))"
          echo "✅ IPO list updated in MongoDB"

          echo "🔄 Updating Upstox ID Mappings..."
          python update_upstox_mapping.py
          echo "✅ Upstox ID Mappings updated"
          
          echo "🚀 Starting Listing Day Breakout Scanner..."
          echo "📅 Date: $(date '+%Y-%m-%d')"
          echo "⏰ Time: $(date '+%H:%M:%S')"
          echo "=========================================="
          
          python listing_day_breakout_scanner.py
          
          echo "✅ Scan complete"
      
      - name: Scan Complete
        run: echo "Listing day breakout scan completed successfully."
